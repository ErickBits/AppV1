# Local reverse proxy for docker compose. Mirrors the routing of k8s/ingress.yaml.
upstream auth        { server auth-service:3000; }
upstream catalog     { server catalog-service:8000; }
upstream reservation { server reservation-service:8000; }
upstream frontend    { server frontend:8080; }

server {
    listen 80;
    client_max_body_size 1m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/         { proxy_pass http://auth; }
    location /api/books         { proxy_pass http://catalog; }
    location /api/reservations  { proxy_pass http://reservation; }
    location /                  { proxy_pass http://frontend; }
}
