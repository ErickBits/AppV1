# NOT applied by kustomize. Create the real secret with `make k8s-secrets`
# (reads the RDS endpoint from Terraform outputs) or copy this file, fill it in and `kubectl apply -f`.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: biblioteca
type: Opaque
stringData:
  DATABASE_URL: postgresql://biblioteca:CHANGE_ME@<rds-endpoint>:5432/biblioteca
  JWT_SECRET: generate-with-openssl-rand-hex-32
  ADMIN_EMAIL: admin@biblioteca.dev
  ADMIN_PASSWORD: CHANGE_ME
