# Local development stack: same images and routing as production, Postgres instead of RDS.
x-app-env: &app-env
  DATABASE_URL: postgresql://biblioteca:biblioteca@postgres:5432/biblioteca
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: dev-only-change-me-0123456789abcdef

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: biblioteca
      POSTGRES_DB: biblioteca
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]

  auth-service:
    build: ./services/auth-service
    environment:
      <<: *app-env
      ADMIN_EMAIL: admin@biblioteca.dev
      ADMIN_PASSWORD: admin12345
    depends_on: { postgres: { condition: service_healthy } }

  catalog-service:
    build: ./services/catalog-service
    environment: *app-env
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }

  reservation-service:
    build: ./services/reservation-service
    environment: *app-env
    depends_on: [catalog-service]

  frontend:
    build: ./frontend

  gateway:
    image: nginx:1.29-alpine
    volumes: ["./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["8080:80"]
    depends_on: [auth-service, catalog-service, reservation-service, frontend]

volumes:
  pgdata:
  redisdata:
